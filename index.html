<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>/ʊ/ Sound Quest — No Typing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at 15% 10%,#3b1b73,transparent 32%),radial-gradient(circle at 85% 15%,#0b526d,transparent 30%),linear-gradient(135deg,#0b0820,#1d1240 55%,#090b24)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #fff;outline-offset:3px}.app{width:min(1050px,94vw);margin:auto;padding:18px 0 45px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:1000;letter-spacing:.08em}.tag{padding:8px 13px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22;color:#d7d1ef;font-weight:800;font-size:.85rem}
.hero{text-align:center;padding:24px 10px}.hero .ipa{font-size:clamp(5rem,17vw,9rem);font-weight:1000;line-height:.85;text-shadow:0 0 35px #a78bfa88}.hero h1{font-size:clamp(1.6rem,5vw,3rem);margin:12px 0 4px}.hero p{color:#c9c4df;margin:0}
.card{background:#ffffff0b;border:1px solid #ffffff1b;border-radius:25px;padding:23px;box-shadow:0 20px 70px #0005;backdrop-filter:blur(10px)}
.hidden{display:none!important}.start{text-align:center}.name{width:min(420px,100%);padding:15px;border-radius:15px;border:1px solid #ffffff28;background:#09071d;color:#fff;font-size:1rem;margin:12px 0}
.primary{min-height:58px;padding:0 27px;border:0;border-radius:17px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-weight:1000;box-shadow:0 10px 30px #8b5cf655}.primary:hover{transform:translateY(-2px);filter:brightness(1.08)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.feature{padding:14px;border-radius:16px;background:#08071b88;border:1px solid #ffffff12}.feature b{display:block}.feature span{color:#c9c4df;font-size:.88rem}
.hud{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin-bottom:15px}.bar{height:11px;background:#ffffff14;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899);transition:.3s}.stat{padding:9px 13px;background:#ffffff0d;border:1px solid #ffffff16;border-radius:13px;font-weight:900}
.round{font-size:.78rem;color:#a5b4fc;font-weight:1000;letter-spacing:.12em}.q{font-size:clamp(1.35rem,4vw,2.2rem);font-weight:1000;margin:9px 0}.target{font-size:clamp(2.8rem,10vw,5.2rem);font-weight:1000;margin:4px 0 8px}.hint{color:#c9c4df;margin-bottom:14px}
.listen{min-height:50px;padding:0 20px;border-radius:14px;background:#0b0925;color:#fff;border:1px solid #ffffff28;font-weight:950}.listen:hover{background:#2a2350}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.choice{min-height:64px;padding:12px;border-radius:17px;background:#ffffff0d;color:#fff;border:2px solid #ffffff18;font-weight:900;font-size:1.05rem}.choice:hover{border-color:#a78bfa;background:#ffffff18;transform:translateY(-2px)}.choice.correct{border-color:#34d399;background:#064e3b99}.choice.wrong{border-color:#fb7185;background:#88133799}
.feedback{min-height:31px;margin:16px 0 2px;font-weight:1000}.good{color:#34d399}.bad{color:#fda4af}.next{min-height:52px;padding:0 25px;border:0;border-radius:14px;background:#fff;color:#150d30;font-weight:1000}.timer{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden;margin-top:16px}.timerfill{height:100%;width:100%;background:linear-gradient(90deg,#34d399,#fbbf24,#fb7185);transition:width 1s linear}
.sort-title{font-size:1.1rem;font-weight:1000;margin-top:18px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.column{min-height:190px;border:2px dashed #ffffff25;border-radius:17px;background:#08071d88;padding:10px;transition:.15s}.column.over{border-color:#22d3ee;background:#15133b}.colhead{text-align:center;font-weight:1000;font-size:.88rem;margin-bottom:8px}.slot{min-height:135px;display:flex;flex-direction:column;gap:7px}.word{padding:11px 9px;border-radius:12px;background:#30255c;border:1px solid #ffffff20;text-align:center;font-weight:900;cursor:grab;user-select:none;touch-action:none}.word:active{cursor:grabbing}.word.selected{outline:3px solid #22d3ee}.word.correct{background:#064e3b;border-color:#34d399}.word.wrong{background:#881337;border-color:#fb7185}
.bank{margin-top:14px;padding:15px;border-radius:18px;background:#09071d;border:1px solid #ffffff14}.bank-title{font-weight:1000;margin-bottom:9px}.bankwords{display:flex;flex-wrap:wrap;gap:9px;min-height:45px}.sortcheck{margin-top:14px}
.result{text-align:center}.trophy{font-size:5rem}.score{font-size:clamp(4rem,13vw,7rem);font-weight:1000;line-height:1}.rank{font-size:1.35rem;color:#fbbf24;font-weight:1000;margin:8px}.muted{color:#c9c4df}
@media(max-width:760px){.features{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.hud{grid-template-columns:1fr 1fr}.hud .bar{grid-column:1/-1}.board{grid-template-columns:repeat(2,1fr)}.column:last-child{grid-column:1/-1}.card{padding:18px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">🎧 IPA SOUND QUEST</div><div class="tag">UNIT 2 • /ʊ/</div></div>

<section id="start">
<div class="hero"><div class="ipa">/ʊ/</div><h1>SHORT U SOUND CHALLENGE</h1><p>No typing. Just listen, choose, drag, and win! 🔥</p></div>
<div class="card start">
<input id="name" class="name" maxlength="30" placeholder="Your name (optional)">
<br><button id="startBtn" class="primary">🚀 START THE QUEST</button>
<div class="features">
<div class="feature"><b>🔊 LISTEN</b><span>Hear the word with one tap.</span></div>
<div class="feature"><b>🎯 CHOOSE</b><span>All IPA answers are multiple choice.</span></div>
<div class="feature"><b>🧩 DRAG</b><span>Sort words into 5 columns—no IPA keyboard needed.</span></div>
</div>
</div>
</section>

<section id="game" class="hidden">
<div class="hud"><div class="bar"><div id="prog" class="fill"></div></div><div class="stat">⭐ <span id="score">0</span></div><div class="stat">🔥 <span id="streak">0</span></div></div>
<div class="card">
<div id="round" class="round"></div><div id="q" class="q"></div><div id="target" class="target"></div><div id="hint" class="hint"></div>
<button id="listen" class="listen">🔊 LISTEN</button>
<div id="area"></div><div id="feedback" class="feedback"></div>
<button id="next" class="next hidden">NEXT ➜</button>
<div class="timer"><div id="timer" class="timerfill"></div></div>
</div>
</section>

<section id="result" class="hidden">
<div class="hero"><div class="trophy">🏆</div><h1>QUEST COMPLETE!</h1></div>
<div class="card result"><div id="finalName"></div><div id="finalScore" class="score"></div><div id="rank" class="rank"></div><p id="msg" class="muted"></p><button id="again" class="primary">🔄 PLAY AGAIN</button></div>
</section>
</div>

<script>
"use strict";
const Q=[
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word matches /hʊd/?",target:"/hʊd/",hint:"Choose the word with the /ʊ/ sound.",opts:["heard","hard","hood","hide"],a:"hood"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word matches /lʊk/?",target:"/lʊk/",hint:"Listen for the short /ʊ/ vowel.",opts:["luck","Luke","lock","look"],a:"look"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word matches /pʊl/?",target:"/pʊl/",hint:"One spelling matches the transcription.",opts:["pal","pull","pole","Paul"],a:"pull"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word matches /fʊl/?",target:"/fʊl/",hint:"Choose the matching spelling.",opts:["fool","foul","fall","full"],a:"full"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word matches /gʊd/?",target:"/gʊd/",hint:"Think of the common word meaning 'nice' or 'correct'.",opts:["goad","God","good","glued"],a:"good"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has the same vowel as LOOK?",target:"LOOK",hint:"Find another /ʊ/ word.",opts:["food","school","book","go"],a:"book"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has /ʊ/?",target:"SHORT U",hint:"Choose the word with the vowel in good.",opts:["student","woman","station","father"],a:"woman"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has /ʊ/?",target:"SHORT U",hint:"Choose the word with the target vowel.",opts:["cushion","complete","camera","rainy"],a:"cushion"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word contains /ʊ/?",target:"3 SYLLABLES",hint:"The /ʊ/ is in the first syllable.",opts:["bulletin","banana","elephant","family"],a:"bulletin"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word contains /ʊ/?",target:"3 SYLLABLES",hint:"Think of a crop made from sugar.",opts:["sugarcane","station","holiday","tomato"],a:"sugarcane"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word contains /ʊ/?",target:"4 SYLLABLES",hint:"The /ʊ/ is near the end.",opts:["misunderstood","information","celebration","education"],a:"misunderstood"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",target:"SHORT U",hint:"Same vowel as put.",opts:["put","peat","pat","part"],a:"put"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",target:"SHORT U",hint:"Same vowel as full.",opts:["fool","feel","full","fail"],a:"full"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",target:"SHORT U",hint:"Same vowel as look.",opts:["look","lake","like","lock"],a:"look"},
{type:"sort",round:"ROUND 3 • FIVE-COLUMN DRAG",q:"Drag each word into the correct column.",target:"5-COLUMN CHALLENGE",hint:"Each column has one /ʊ/ word. Put the words with /ʊ/ in the column shown by the number of letters.",groups:[
["book"],["pull"],["woman"],["look"],["good"]
],words:["book","food","pull","school","woman","pool","look","good","go","ball"],labels:["4 letters","4 letters","5 letters","4 letters","4 letters"]},
{type:"sort",round:"ROUND 4 • /ʊ/ WORD RAID",q:"Drag the five /ʊ/ words into the five columns.",target:"FIND ALL 5",hint:"Only five words have /ʊ/. Put one correct /ʊ/ word in each column.",groups:[
["cushion"],["should"],["sugar"],["full"],["cookbook"]
],words:["cushion","should","sugar","full","cookbook","student","food","home","ball","station"],labels:["① /ʊ/","② /ʊ/","③ /ʊ/","④ /ʊ/","⑤ /ʊ/"]}
];

let i=0,score=0,streak=0,timer=null,answered=false,name="";
const $=x=>document.getElementById(x);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function speak(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.speak(u)}
function update(){ $("score").textContent=score;$("streak").textContent=streak;$("prog").style.width=(i/Q.length*100)+"%"}
function startTimer(){clearInterval(timer);let n=15;$("timer").style.width="100%";timer=setInterval(()=>{n--;$("timer").style.width=(n/15*100)+"%";if(n<=0){clearInterval(timer);timeout()}},1000)}
function timeout(){if(answered)return;answered=true;streak=0;$("feedback").innerHTML='<span class="bad">⏰ TIME! The answer was revealed.</span>';reveal();$("next").classList.remove("hidden")}
function reveal(){document.querySelectorAll(".choice").forEach(b=>{if(b.dataset.correct==="1")b.classList.add("correct")})}
function render(){
answered=false;clearInterval(timer);$("feedback").textContent="";$("next").classList.add("hidden");
let x=Q[i];$("round").textContent=x.round;$("q").textContent=x.q;$("target").textContent=x.target;$("hint").textContent=x.hint;$("area").innerHTML="";
if(x.type==="mc"){
 $("listen").classList.remove("hidden");
 let c=document.createElement("div");c.className="choices";
 shuffle(x.opts).forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.dataset.correct=o===x.a?"1":"0";b.onclick=()=>mc(b,o,x.a);c.appendChild(b)});$("area").appendChild(c);startTimer();
}else{
 $("listen").classList.add("hidden");renderSort(x);
}
update()
}
function mc(b,o,a){
 if(answered)return;answered=true;clearInterval(timer);document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
 if(o===a){let pts=100+streak*25;score+=pts;streak++;b.classList.add("correct");$("feedback").innerHTML='<span class="good">✅ CORRECT! +'+pts+'</span>'}
 else{streak=0;b.classList.add("wrong");reveal();$("feedback").innerHTML='<span class="bad">❌ Correct answer: <b>'+a+'</b></span>'}
 update();$("next").classList.remove("hidden")
}
function renderSort(x){
 let board=document.createElement("div");board.className="board";
 for(let n=0;n<5;n++){
   let col=document.createElement("div");col.className="column";col.dataset.n=n;
   let head=document.createElement("div");head.className="colhead";head.textContent=x.labels[n];col.appendChild(head);
   let slot=document.createElement("div");slot.className="slot";col.appendChild(slot);
   col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
   col.ondragleave=()=>col.classList.remove("over");
   col.ondrop=e=>{e.preventDefault();col.classList.remove("over");let id=e.dataTransfer.getData("text/plain");let w=document.querySelector('[data-id="'+id+'"]');if(w&&!slot.children.length)slot.appendChild(w)};
   board.appendChild(col)
 }
 let bank=document.createElement("div");bank.className="bank";bank.innerHTML='<div class="bank-title">🧩 WORD BANK — drag the words into the 5 columns</div><div class="bankwords" id="bankwords"></div>';
 x.words.forEach((w,n)=>{let b=document.createElement("div");b.className="word";b.textContent=w;b.draggable=true;b.dataset.id="w"+n;b.ondragstart=e=>e.dataTransfer.setData("text/plain",b.dataset.id);b.onclick=()=>tapWord(b);$("area").appendChild(document.createElement("span"));bank.querySelector("#bankwords").appendChild(b)});
 $("area").appendChild(board);$("area").appendChild(bank);
 let check=document.createElement("button");check.className="primary sortcheck";check.textContent="✅ CHECK MY 5 COLUMNS";check.onclick=()=>checkSort(x,board);$("area").appendChild(check);
}
function tapWord(b){
 document.querySelectorAll(".word").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");
 let empty=[...document.querySelectorAll(".column .slot")].find(s=>!s.children.length);
 if(empty){empty.appendChild(b);b.classList.remove("selected")}
}
function checkSort(x,board){
 if(answered)return;
 let chosen=[...board.querySelectorAll(".slot")].map(s=>s.firstElementChild?.textContent||"");
 let correct=true;
 for(let n=0;n<5;n++){if(chosen[n]!==x.groups[n][0])correct=false}
 answered=true;
 if(correct){score+=500;streak++;$("feedback").innerHTML='<span class="good">🔥 PERFECT! All 5 columns are correct! +500</span>';board.querySelectorAll(".word").forEach(w=>w.classList.add("correct"))}
 else{streak=0;$("feedback").innerHTML='<span class="bad">❌ Not quite. The five /ʊ/ answers are: <b>'+x.groups.map(g=>g[0]).join(", ")+'</b></span>';board.querySelectorAll(".word").forEach(w=>w.classList.add("wrong"))}
 update();$("next").classList.remove("hidden")
}
$("listen").onclick=()=>speak(Q[i].target);
$("startBtn").onclick=()=>{name=$("name").value.trim();$("start").classList.add("hidden");$("game").classList.remove("hidden");i=0;score=0;streak=0;render()};
$("next").onclick=()=>{if(i<Q.length-1){i++;render()}else finish()};
function finish(){clearInterval(timer);$("game").classList.add("hidden");$("result").classList.remove("hidden");$("finalName").textContent=name?("Well done, "+name+"!"): "Well done, Sound Master!";$("finalScore").textContent=score;let r=score>=1600?"🏆 /ʊ/ SOUND MASTER":score>=900?"🔥 /ʊ/ EXPERT":"💪 KEEP PRACTICING";$("rank").textContent=r;$("msg").textContent="You practiced the /ʊ/ sound using listening, multiple choice, and drag-and-drop — no IPA keyboard required."}
$("again").onclick=()=>{$("result").classList.add("hidden");$("start").classList.remove("hidden")}
})();
</script>
</body>
</html>
