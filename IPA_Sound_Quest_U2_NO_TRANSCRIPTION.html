<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>/ʊ/ Sound Quest — No Typing</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#10152f,#171d46 55%,#24134a);color:#fff;min-height:100vh}
button{font:inherit;cursor:pointer}.wrap{max-width:1050px;margin:auto;padding:24px 18px 50px}
.card{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:24px;box-shadow:0 15px 50px rgba(0,0,0,.25)}
.hidden{display:none!important}.hero{text-align:center;padding:35px 20px}.logo{font-size:15px;font-weight:800;letter-spacing:2px;color:#8ee7ff}.hero h1{font-size:clamp(32px,7vw,64px);margin:10px 0 5px}.hero p{color:#cdd5ff;font-size:17px}.start{background:#fff;color:#161a3d;border:0;border-radius:16px;padding:16px 28px;font-weight:900;font-size:18px;margin-top:15px;box-shadow:0 8px 25px rgba(0,0,0,.25)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.pill{background:#ffffff16;border:1px solid #ffffff22;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:800}.score{color:#8ee7ff}
.progress{height:10px;background:#ffffff16;border-radius:99px;overflow:hidden;margin:15px 0 24px}.bar{height:100%;width:0;background:#8ee7ff;transition:.3s}
.round{font-size:13px;font-weight:900;letter-spacing:1px;color:#ffd66b}.question{font-size:clamp(23px,4vw,36px);font-weight:900;line-height:1.2;margin:12px 0 8px}.hint{color:#cbd1f3;margin-bottom:20px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.choice{min-height:68px;border:2px solid #ffffff18;background:#ffffff0d;color:#fff;border-radius:16px;padding:14px;font-size:20px;font-weight:800}.choice:hover{background:#ffffff18}.choice:disabled{cursor:default}
.feedback{text-align:center;min-height:30px;margin:16px 0;font-weight:900;font-size:18px}.good{color:#7dffb2}.bad{color:#ff9b9b}
.next{display:block;margin:5px auto 0;border:0;border-radius:14px;background:#8ee7ff;color:#11183a;padding:13px 25px;font-weight:900}
.listen{border:1px solid #ffffff2b;background:#ffffff10;color:#fff;border-radius:12px;padding:10px 14px;font-weight:800;margin-bottom:16px}
.timer{font-size:20px;font-weight:900;color:#ffd66b}
.drag-intro{color:#d7dcff;margin-bottom:15px}.bank{display:flex;flex-wrap:wrap;gap:10px;padding:15px;background:#ffffff09;border-radius:16px;min-height:70px;margin-bottom:18px}.word{background:#fff;color:#171a3d;border:0;border-radius:13px;padding:12px 16px;font-weight:900;touch-action:none;user-select:none}.word.used{opacity:.35}.columns{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.col{min-height:180px;background:#ffffff08;border:2px dashed #ffffff2b;border-radius:16px;padding:10px;text-align:center}.col h3{font-size:13px;margin:4px 0 10px;color:#ffd66b}.drop{min-height:120px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center}.drop .word{width:100%;font-size:14px}.small{font-size:12px;color:#b9c1e8}.result{text-align:center}.bigscore{font-size:70px;font-weight:1000;color:#8ee7ff}.rank{font-size:24px;font-weight:900;margin:10px}.restart{border:0;background:#fff;color:#161a3d;border-radius:14px;padding:13px 22px;font-weight:900;margin-top:15px}
@media(max-width:700px){.choices{grid-template-columns:1fr}.columns{grid-template-columns:repeat(2,1fr)}.columns .col:last-child{grid-column:1/-1}.hero{padding:25px 10px}.card{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
<section id="home" class="card hero">
<div class="logo">NONTHABURI MAGNET SCHOOL • ENGLISH PROGRAM</div>
<h1>🎧 /ʊ/ SOUND QUEST</h1>
<p>UNIT 2 REVIEW • <b>NO TYPING • NO IPA TRANSCRIPTION</b></p>
<p>Choose answers, listen, and drag words. Everything is clickable or touch-friendly.</p>
<button class="start" onclick="startGame()">START CHALLENGE 🚀</button>
</section>

<section id="game" class="card hidden">
<div class="top">
<div class="pill" id="roundPill">ROUND 1</div>
<div class="pill">SCORE <span class="score" id="score">0</span></div>
<div class="pill timer">⏱ <span id="time">15</span>s</div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="content"></div>
</section>

<section id="result" class="card result hidden">
<div class="logo">CHALLENGE COMPLETE</div>
<h1>🎉 Great Job!</h1>
<div class="bigscore" id="finalScore">0</div>
<div class="rank" id="rank"></div>
<p id="message"></p>
<button class="restart" onclick="location.reload()">PLAY AGAIN 🔄</button>
</section>
</div>

<script>
const qs=[
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has the /ʊ/ sound?",listen:"hood",opts:["heard","hood","hard","hide"],a:"hood"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has the /ʊ/ sound?",listen:"look",opts:["luck","Luke","look","lock"],a:"look"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has the /ʊ/ sound?",listen:"pull",opts:["pal","pole","Paul","pull"],a:"pull"},
{type:"mc",round:"ROUND 1 • SOUND DETECTIVE",q:"Which word has the /ʊ/ sound?",listen:"full",opts:["fool","foul","fall","full"],a:"full"},
{type:"mc",round:"1 • SOUND DETECTIVE",q:"Which word has the /ʊ/ sound?",listen:"good",opts:["God","goad","good","glued"],a:"good"},

{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word contains the same vowel sound as LOOK?",listen:"book",opts:["food","book","go","ball"],a:"book"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",listen:"woman",opts:["woman","home","talk","suit"],a:"woman"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",listen:"cushion",opts:["station","cushion","student","food"],a:"cushion"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",listen:"sugar",opts:["sugar","school","ball","home"],a:"sugar"},
{type:"mc",round:"ROUND 2 • TRICKY WORDS",q:"Which word has /ʊ/?",listen:"should",opts:["show","should","shoe","share"],a:"should"},

{type:"drag",round:"ROUND 3 • 5-COLUMN WORD MATCH",q:"Drag each word to the column with the same meaning.",cols:[
["A place to cook","cookbook"],["A thing you use to sit or sleep on?","cushion"],["A word meaning 'ought to'","should"],["A sweet ingredient","sugar"],["A word meaning 'complete'","full"]
],words:["cookbook","cushion","should","sugar","full","food","home","ball","student","go"]},

{type:"mc",round:"ROUND 4 • QUICK FIRE",q:"Which word is spelled with /ʊ/?",listen:"put",opts:["put","pet","part","port"],a:"put"},
{type:"mc",round:"ROUND 4 • QUICK FIRE",q:"Which word is spelled with /ʊ/?",listen:"cookbook",opts:["cookbook","cakebook","schoolbook","notebook"],a:"cookbook"},
{type:"mc",round:"ROUND 4 • QUICK FIRE",q:"Which word is spelled with /ʊ/?",listen:"bulletin",opts:["bulletin","button","between","bottle"],a:"bulletin"},
{type:"mc",round:"ROUND 4 • QUICK FIRE",q:"Which word is spelled with /ʊ/?",listen:"misunderstood",opts:["misunderstood","understood","understand","misunderstand"],a:"misunderstood"}
];

let i=0,score=0,timer,answered=false,dragScore=0;
const $=id=>document.getElementById(id);

function startGame(){ $("home").classList.add("hidden"); $("game").classList.remove("hidden"); render(); }

function speak(text){
 if(!("speechSynthesis" in window)) return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.rate=.75; u.lang="en-US"; speechSynthesis.speak(u);
}

function render(){
 clearInterval(timer); answered=false;
 const q=qs[i];
 $("roundPill").textContent=q.round;
 $("bar").style.width=((i/qs.length)*100)+"%";
 $("content").innerHTML="";
 if(q.type==="mc") renderMC(q); else renderDrag(q);
 startTimer();
}

function startTimer(){
 let t=15;$("time").textContent=t;
 timer=setInterval(()=>{
  t--;$("time").textContent=t;
  if(t<=0){clearInterval(timer); if(!answered){answered=true; showFeedback(false,"⏰ Time's up!"); disableChoices();}}
 },1000);
}

function renderMC(q){
 $("content").innerHTML=`
 <div class="question">${q.q}</div>
 <button class="listen" onclick="speak('${q.listen.replace(/'/g,"\\'")}')">🔊 LISTEN</button>
 <div class="hint">Choose ONE answer.</div>
 <div class="choices" id="choices"></div>
 <div class="feedback" id="feedback"></div>
 <button class="next hidden" id="next" onclick="nextQ()">NEXT ➜</button>`;
 const box=$("choices");
 q.opts.forEach(o=>{
  const b=document.createElement("button");b.className="choice";b.textContent=o;
  b.onclick=()=>checkMC(b,o,q.a);
  box.appendChild(b);
 });
}
function checkMC(btn,choice,answer){
 if(answered)return;answered=true;clearInterval(timer);disableChoices();
 if(choice===answer){score+=100;btn.style.borderColor="#7dffb2";showFeedback(true,"✅ Correct! +100");}
 else{btn.style.borderColor="#ff9b9b";showFeedback(false,"❌ Not quite. The answer is "+answer+".");}
 $("score").textContent=score;$("next").classList.remove("hidden");
}
function disableChoices(){document.querySelectorAll(".choice").forEach(b=>b.disabled=true)}
function showFeedback(ok,msg){$("feedback").textContent=msg;$("feedback").className="feedback "+(ok?"good":"bad")}

function renderDrag(q){
 $("content").innerHTML=`<div class="question">${q.q}</div>
 <div class="drag-intro">Drag each word into the box that matches its clue. <b>No typing.</b></div>
 <div class="bank" id="bank"></div><div class="columns" id="cols"></div>
 <div class="feedback" id="feedback"></div>
 <button class="next hidden" id="next" onclick="nextQ()">NEXT ➜</button>`;
 const bank=$("bank"),cols=$("cols");
 q.cols.forEach((c,idx)=>{
  const d=document.createElement("div");d.className="col";
  d.innerHTML=`<h3>${c[0]}</h3><div class="drop" data-answer="${c[1]}"><span class="small">DROP HERE</span></div>`;
  cols.appendChild(d);
 });
 q.words.forEach(w=>{
  const el=document.createElement("button");el.className="word";el.textContent=w;el.draggable=true;el.dataset.word=w;
  el.addEventListener("dragstart",e=>e.dataTransfer.setData("text/plain",w));
  el.addEventListener("click",()=>tapWord(w,el));
  bank.appendChild(el);
 });
 document.querySelectorAll(".drop").forEach(drop=>{
  drop.addEventListener("dragover",e=>e.preventDefault());
  drop.addEventListener("drop",e=>{e.preventDefault();placeWord(e.dataTransfer.getData("text/plain"),drop);});
 });
}
function tapWord(w,el){
 const drops=[...document.querySelectorAll(".drop")];
 const target=promptTarget(w);
 if(target)placeWord(w,target);
}
function promptTarget(w){
 const map={cookbook:"cookbook",cushion:"cushion",should:"should",sugar:"sugar",full:"full"};
 if(map[w]){
  return [...document.querySelectorAll(".drop")].find(d=>d.dataset.answer===map[w]);
 }
 return null;
}
function placeWord(w,drop){
 if(!w||answered)return;
 const correct=w===drop.dataset.answer;
 if(!correct){showFeedback(false,"❌ Try again — check the clue.");return}
 const el=[...document.querySelectorAll(".word")].find(x=>x.dataset.word===w&&!x.classList.contains("used"));
 if(!el)return;
 el.classList.add("used");el.draggable=false;
 const clone=el.cloneNode(true);clone.classList.remove("used");clone.style.cursor="default";
 drop.innerHTML="";drop.appendChild(clone);
 dragScore+=100;score+=100;$("score").textContent=score;
 const remaining=[...document.querySelectorAll(".word")].filter(x=>!x.classList.contains("used")).length;
 if(remaining===5){showFeedback(true,"Keep going! 5 target words are still available.");}
 if(document.querySelectorAll(".drop .word").length===5){
  answered=true;clearInterval(timer);showFeedback(true,"🎉 All 5 matches correct! +500");$("next").classList.remove("hidden");
 }
}
function nextQ(){i++; if(i>=qs.length)finish(); else render();}
function finish(){
 clearInterval(timer);$("game").classList.add("hidden");$("result").classList.remove("hidden");
 $("finalScore").textContent=score;
 $("rank").textContent=score>=1400?"🏆 /ʊ/ SOUND MASTER":score>=900?"🔥 /ʊ/ EXPERT":"💪 KEEP PRACTICING";
 $("message").textContent="This review uses multiple choice, listening, and drag-and-drop only. There is NO IPA transcription and NO answer typing.";
}
</script>
</body>
</html>
